# Builds the Floor Heating image and pushes it to GHCR on every tag like
# floor-heating-v0.1.0 (image tag 0.1.0). Plain v* tags belong to docker.yml.
name: image-floor-heating
on:
  push:
    tags: ["floor-heating-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrshakhov/umbrel-floor-heating
          tags: |
            type=match,pattern=floor-heating-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: homelab-floor-heating
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
