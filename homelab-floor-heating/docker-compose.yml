version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: homelab-floor-heating_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/mrshakhov/umbrel-floor-heating:0.2.0
    restart: on-failure
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      POLL_INTERVAL: "60s"
