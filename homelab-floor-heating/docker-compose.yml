version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: homelab-floor-heating_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/mrshakhov/umbrel-floor-heating:0.5.0
    restart: on-failure
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      POLL_INTERVAL: "60s"

  # Pins thermostat addresses on the host - see README "Thermostats that stop answering".
  neighbors:
    image: ghcr.io/mrshakhov/umbrel-floor-heating:0.5.0
    command: ["pin-neighbors"]
    restart: on-failure
    init: true
    network_mode: host
    user: "0:0"  # capabilities don't reach a non-root user
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN  # the only capability: without DAC_OVERRIDE, root can't read the keys
    security_opt:
      - no-new-privileges:true
    mem_limit: 16m
    volumes:
      - ${APP_DATA_DIR}/data:/data:ro
