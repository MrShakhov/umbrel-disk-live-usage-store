manifestVersion: 1
id: homelab-floor-heating
name: Floor Heating
tagline: History for Tuya Wi-Fi floor heating thermostats
icon: https://raw.githubusercontent.com/MrShakhov/umbrel-homelab-store/main/homelab-floor-heating/web/icon.svg
category: automation
version: "0.2.0"
port: 7842
description: >-
  Keeps the history that the vendor's mobile app does not. Polls Tuya Wi-Fi
  thermostats over your local network once a minute and records what they report.


  - Read-only: the app only sends status queries and cannot change a thermostat

  - Works on your LAN, with no cloud account at runtime

  - Charts of room and set temperature, heating time and outages

  - Readings stay in the app's data folder as one JSON Lines file per day


  You need each thermostat's local key, its device ID and a fixed IP address. See
  the README for how to get them.
